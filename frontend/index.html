<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Health Insurance Fraud Intelligence — agentic claim review with explainable risk scoring and audit trails."
    />
    <meta name="theme-color" content="#f2f0e8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231b4a3a'/%3E%3Cpath d='M12 5.5c1.7 1.3 3.2 2 5 2v4.2c0 3.7-2.6 5.6-5 6.7-2.4-1.1-5-3-5-6.7V7.5c1.8 0 3.3-.7 5-2z' fill='none' stroke='%23f8f5ec' stroke-width='1.4' stroke-linejoin='round'/%3E%3Cpath d='m9.8 12 1.5 1.5 3-3' fill='none' stroke='%23f8f5ec' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Health Fraud Intelligence — Agentic Claim Review</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("hfi-theme")
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "dark" ? "#0a1310" : "#f2f0e8",
            )
          }
        } catch {
          /* no-op */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
